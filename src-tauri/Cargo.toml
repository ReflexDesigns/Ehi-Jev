[package]
name = "heyjev"
version = "0.2.16"
description = "HeyJev - Direttore Operativo Vocale del PC (The Notch)"
authors = ["HeyJev"]
edition = "2021"

[lib]
name = "heyjev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tempfile = "3"
cpal = "0.16"
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["static"] }
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tokio = { version = "1.53.1", features = ["sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
]
